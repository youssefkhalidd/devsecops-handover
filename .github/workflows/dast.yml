name: DAST (OWASP ZAP Baseline)

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: Start app and run ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application
        run: |
          python -m flask --app app.app run --host 0.0.0.0 --port 5000 > flask.log 2>&1 &
          echo $! > flask.pid

      - name: Wait for application to become available
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready."
          cat flask.log
          exit 1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: false
